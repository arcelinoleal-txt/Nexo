<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Boreal slide</title><style>
/* ESTILO B - Boreal Marketing (carrossel 1080x1350). Troque só os textos marcados com TROCAR. */
:root{--bg1:#291132;--bg2:#140a20;--mint:#68efc4;--green:#54f03e;--lilas:#e3c2ec;--line:#96318a;--btn:#55346d;--muted:#bb9ec5;--insta:#9bffc4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#140a20}

 background:radial-gradient(900px 700px at 15% 100%,#25163a 0%,transparent 70%),linear-gradient(180deg,var(--bg1) 0%,#22102d 45%,#140a20 100%)}

.foto{position:absolute;left:0;top:0;width:1080px;height:400px;background:url(foto-fundo.jpg) center/cover,linear-gradient(180deg,#8a7a7a 0%,#4a3a52 60%,#281030 100%);

.top .tags{color:#d3b6e6;font-size:20px;letter-spacing:.26em}

h1 em{font-style:normal;color:var(--green)}

.body{position:absolute;top:797px;left:150px;right:150px;text-align:center;font-size:26px;line-height:42px;color:var(--lilas);font-weight:300}
.btn{position:absolute;top:915px;left:50%;transform:translateX(-50%);height:72px;padding:0 34px;border:2px solid var(--btn);border-radius:36px;display:flex;align-items:center;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#d9c3e8;white-space:nowrap}
.insta{position:absolute;top:1190px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;font-size:34px;letter-spacing:.1em;color:#d9c3e8}
.insta svg{width:30px;height:30px;stroke:var(--insta);fill:none;stroke-width:2.4}
.count{position:absolute;top:1264px;left:0;right:0;text-align:center;font-size:21px;letter-spacing:.1em;color:var(--muted)}
</style></head><body><div class="s">
