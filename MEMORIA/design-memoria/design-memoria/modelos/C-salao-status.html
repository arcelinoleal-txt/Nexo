<!doctype html><html><head><meta charset="utf-8"><style>
:root{--cream:#ecdccb;--brown:#3a2418;--g1:#f6dfc0;--g2:#d1a070;--g3:#8f5b3a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#120b08}
.a{position:relative;width:1080px;height:1920px;color:#f3e6d6;font-family:'Carlito','Liberation Sans',sans-serif;
 background:radial-gradient(1000px 800px at 85% 45%,#3a2418 0%,transparent 70%),radial-gradient(800px 600px at 0% 100%,#2a1810 0%,transparent 70%),linear-gradient(180deg,#1b110c,#0e0806)}
.gold{background:linear-gradient(180deg,var(--g1) 10%,var(--g2) 55%,var(--g3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.photo{position:absolute;left:240px;top:520px;width:840px;height:1033px;overflow:hidden;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 14%,#000 72%,transparent 100%)}
.photo img{width:840px;height:1033px;display:block;filter:brightness(1.18) contrast(1.04)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#120b08 0%,rgba(18,11,8,.45) 22%,transparent 46%,transparent 90%,rgba(18,11,8,.5) 100%)}
.eyebrow{position:absolute;top:196px;left:0;right:0;text-align:center;font-size:34px;letter-spacing:.42em;color:#ecd2b0;padding-left:.42em}
.eyebrow i{font-style:normal;color:var(--g2);margin-left:.5em}
.liso{position:absolute;top:235px;left:0;right:0;text-align:center;font-family:'GFS Baskerville','Caladea',serif;font-size:300px;line-height:1;letter-spacing:.02em}
.perf{position:absolute;top:440px;left:0;right:0;text-align:center;font-family:'Caladea',serif;font-style:italic;font-size:230px;line-height:1;transform:rotate(-5deg);text-shadow:0 6px 30px rgba(0,0,0,.5)}
.tag{position:absolute;top:668px;left:62px;width:600px;font-size:32px;line-height:1.3;letter-spacing:.04em;color:#f0e2d0}
.card{position:absolute;left:56px;width:560px;height:220px;border-radius:34px;background:linear-gradient(180deg,#f0e1d0,#e2cdb6);display:flex;align-items:center;padding:0 34px 0 28px;color:var(--brown);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.ico{flex:none;width:150px;height:150px;border-radius:50%;background:#2a1a12;border:3px solid #c79a6a;display:flex;align-items:center;justify-content:center}
.txt{margin-left:26px;flex:1}
.lab{font-weight:700;font-size:40px;letter-spacing:.03em;line-height:1}
.sub{font-size:28px;margin-top:6px;opacity:.8;border-bottom:1.5px dotted rgba(58,36,24,.5);padding-bottom:6px}
.price{display:flex;align-items:baseline;justify-content:flex-end;margin-top:6px}
.price small{font-size:34px;font-weight:700;margin-right:8px}
.price b{font-family:'Caladea',serif;font-size:108px;line-height:1;font-weight:700;letter-spacing:-.01em}
.valid{position:absolute;left:56px;top:1262px;width:640px;height:150px;border-radius:75px;border:2px solid rgba(209,160,112,.7);background:rgba(20,12,8,.55);display:flex;align-items:center;padding-left:14px;gap:26px}
.cal{flex:none;width:122px;height:122px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center}
.valid p{font-size:30px;line-height:1.15;color:#f0e2d0}
.valid p em{display:block;font-family:'Caladea',serif;font-style:italic;font-size:50px;line-height:1.05;color:#f1cfa4}
.cuidar{position:absolute;left:56px;top:1440px;font-family:'Caladea',serif;font-style:italic;font-size:42px;color:#ecd9c4}
.brand{position:absolute;left:56px;top:1498px}
.brand small{display:block;font-size:30px;letter-spacing:.5em;color:#d8b58d}
.brand div{font-family:'GFS Baskerville','Caladea',serif;font-size:112px;line-height:1.05}
.zap{position:absolute;left:56px;right:56px;top:1676px;height:86px;display:flex;align-items:center;gap:22px}
.zi{flex:none;width:86px;height:86px;border-radius:50%;background:#25c05b;display:flex;align-items:center;justify-content:center}
.zap span{font-size:28px;letter-spacing:.14em;color:#d8b58d;display:block}
.zap b{font-size:62px;letter-spacing:.02em;color:#fff;line-height:1}
.line{position:absolute;left:56px;right:56px;top:1662px;height:1px;background:linear-gradient(90deg,rgba(209,160,112,.8),transparent)}
</style></head><body><div class="a">
<div class="photo"><img src="cabelo_exemplo.png"></div>

 <p>Promoção válida<em>só esse mês!</em>vagas limitadas</p>
</div>

 <div><span>AGENDE SEU HORÁRIO</span><b>(11) 97592-9957</b></div></div>
